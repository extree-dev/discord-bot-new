services:
    postgres:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-discordbot}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-discordbot}
            POSTGRES_DB: ${POSTGRES_DB:-discordbot}
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-discordbot} -d ${POSTGRES_DB:-discordbot}']
            interval: 5s
            timeout: 5s
            retries: 10

    bot:
        build: .
        restart: unless-stopped
        env_file:
            - .env
        environment:
            DATABASE_URL: postgresql://${POSTGRES_USER:-discordbot}:${POSTGRES_PASSWORD:-discordbot}@postgres:5432/${POSTGRES_DB:-discordbot}
        depends_on:
            postgres:
                condition: service_healthy
        volumes:
            - bot-data:/app/data

    db-backup:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            PGHOST: postgres
            PGUSER: ${POSTGRES_USER:-discordbot}
            PGPASSWORD: ${POSTGRES_PASSWORD:-discordbot}
            PGDATABASE: ${POSTGRES_DB:-discordbot}
            BACKUP_KEEP: 7
        volumes:
            - ./backups:/backups
        depends_on:
            postgres:
                condition: service_healthy
        entrypoint: ['/bin/sh', '-c']
        command:
            - |
                set -o pipefail
                while true; do
                    file=/backups/discordbot-$$(date +%Y-%m-%d_%H%M).sql.gz
                    if pg_dump --clean --if-exists | gzip > "$$file.tmp"; then
                        mv "$$file.tmp" "$$file"
                        echo "backup: $$file"
                    else
                        rm -f "$$file.tmp"
                        echo "backup: pg_dump завершился с ошибкой" >&2
                    fi
                    ls -1t /backups/discordbot-*.sql.gz 2>/dev/null | tail -n +$$((BACKUP_KEEP + 1)) | xargs -r rm -f
                    sleep 86400
                done

    dashboard:
        build: .
        restart: unless-stopped
        env_file:
            - .env
        environment:
            DATABASE_URL: postgresql://${POSTGRES_USER:-discordbot}:${POSTGRES_PASSWORD:-discordbot}@postgres:5432/${POSTGRES_DB:-discordbot}
        depends_on:
            postgres:
                condition: service_healthy
        command: ['node', 'dashboard/server.js']

    stats-backend:
        build: .
        restart: unless-stopped
        env_file:
            - .env
        environment:
            DATABASE_URL: postgresql://${POSTGRES_USER:-discordbot}:${POSTGRES_PASSWORD:-discordbot}@postgres:5432/${POSTGRES_DB:-discordbot}
        depends_on:
            postgres:
                condition: service_healthy
        command: ['node', 'stats-backend/server.js']

    # --- НОВЫЙ СЕРВИС JAVA ---
    stats-backend-java:
        build:
            context: ./stats-backend-java
        restart: unless-stopped
        env_file:
            - .env
        environment:
            SPRING_PROFILES_ACTIVE: prod
            # ЯВНО УКАЗЫВАЕМ ПАРАМЕТРЫ ПОДКЛЮЧЕНИЯ К БАЗЕ, ЧТОБЫ JAVA НЕ ИСКАЛА ЕЁ НА LOCALHOST
            SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-discordbot}
            SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-discordbot}
            SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-discordbot}
            # Почта: пробрасываем явно, чтобы без STATS_MAIL_* контейнер не поднялся
            # с пустым SMTP и не падал на первом /auth/register с 500.
            SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.mail.me.com}
            SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
            SPRING_MAIL_USERNAME: ${STATS_MAIL_USER:?STATS_MAIL_USER is required}
            SPRING_MAIL_PASSWORD: ${STATS_MAIL_APP_PASSWORD:?STATS_MAIL_APP_PASSWORD is required}
            EXTREE_MAIL_FROM: ${STATS_MAIL_FROM:-}
        # Порт НЕ публикуется на хост: Caddy достаёт сервис по имени через
        # внутреннюю docker-сеть (reverse_proxy stats-backend-java:8081 в
        # web/Caddyfile). Публикация 8081:8081 позволяла обратиться к бэкенду
        # напрямую, минуя Caddy и его проверку хоста — это открывало
        # Host-header injection (поддельный заголовок Host в письмах со
        # сбросом пароля/тикетами/Riot OAuth redirect_uri).
        depends_on:
            postgres:
                condition: service_healthy

    caddy:
        image: caddy:2-alpine
        restart: unless-stopped
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - ./web/Caddyfile:/etc/caddy/Caddyfile:ro
            - ./web/bot-site:/srv/bot-site:ro
            - ./web/stats-site:/srv/stats-site:ro
            - caddy_data:/data
            - caddy_config:/config

    stats-frontend-builder:
        build:
            context: ./stats-frontend
        profiles: ['build-only']
        volumes:
            - ./web/stats-site:/output

volumes:
    pgdata:
    bot-data:
    caddy_data:
    caddy_config:
