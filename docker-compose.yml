services:
    postgres:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-discordbot}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-discordbot}
            POSTGRES_DB: ${POSTGRES_DB:-discordbot}
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-discordbot} -d ${POSTGRES_DB:-discordbot}']
            interval: 5s
            timeout: 5s
            retries: 10

    bot:
        build: .
        restart: unless-stopped
        env_file:
            - .env
        environment:
            # Внутри сети docker compose сервис БД доступен по имени "postgres",
            # а не localhost — переопределяем DATABASE_URL из .env, если он там
            # указывает на локальный адрес.
            DATABASE_URL: postgresql://${POSTGRES_USER:-discordbot}:${POSTGRES_PASSWORD:-discordbot}@postgres:5432/${POSTGRES_DB:-discordbot}
        depends_on:
            postgres:
                condition: service_healthy
        volumes:
            - bot-data:/app/data

    # Ежедневный дамп базы в ./backups на хосте (рядом с docker-compose.yml),
    # хранятся последние BACKUP_KEEP файлов. Раньше вся база жила только в
    # томе pgdata без единой копии — потеря тома означала потерю всего.
    # Первый дамп — сразу при запуске сервиса. Восстановление:
    # gunzip -c backups/<файл>.sql.gz | docker compose exec -T postgres psql -U discordbot discordbot
    db-backup:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            PGHOST: postgres
            PGUSER: ${POSTGRES_USER:-discordbot}
            PGPASSWORD: ${POSTGRES_PASSWORD:-discordbot}
            PGDATABASE: ${POSTGRES_DB:-discordbot}
            BACKUP_KEEP: 7
        volumes:
            - ./backups:/backups
        depends_on:
            postgres:
                condition: service_healthy
        entrypoint: ['/bin/sh', '-c']
        command:
            - |
                set -o pipefail
                while true; do
                    file=/backups/discordbot-$$(date +%Y-%m-%d_%H%M).sql.gz
                    if pg_dump --clean --if-exists | gzip > "$$file.tmp"; then
                        mv "$$file.tmp" "$$file"
                        echo "backup: $$file"
                    else
                        rm -f "$$file.tmp"
                        echo "backup: pg_dump завершился с ошибкой" >&2
                    fi
                    ls -1t /backups/discordbot-*.sql.gz 2>/dev/null | tail -n +$$((BACKUP_KEEP + 1)) | xargs -r rm -f
                    sleep 86400
                done

volumes:
    pgdata:
    bot-data:
