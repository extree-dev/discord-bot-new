name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    lint-and-test:
        runs-on: ubuntu-latest
        # Тесты, доходящие до хранилища (security/config.js, tickets/config.js,
        # utils/warnings.js), работают через настоящий PostgreSQL, а не мок —
        # поднимаем его как сервис-контейнер рядом с job.
        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: discordbot
                    POSTGRES_PASSWORD: discordbot
                    POSTGRES_DB: discordbot
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U discordbot -d discordbot"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        env:
            DATABASE_URL: postgresql://discordbot:discordbot@localhost:5432/discordbot
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Check formatting
              run: npm run format:check

            - name: Test
              run: npm test --if-present

            # frontend/ — отдельный React/TS-проект (dashboard/, визитка),
            # свой package-lock.json, свои node_modules, не часть npm ci
            # выше. format:check с корня уже покрывает *.ts/*.tsx (общий
            # .prettierrc), сборка здесь дополнительно проверяет, что
            # результат реально компилируется в валидный бандл.
            - name: Install frontend dependencies
              working-directory: frontend
              run: npm ci

            - name: Frontend lint
              working-directory: frontend
              run: npm run lint

            - name: Frontend test
              working-directory: frontend
              run: npm test

            - name: Frontend build
              working-directory: frontend
              run: npm run build

            # stats-frontend/ — ещё один отдельный React/TS-проект (Extree
            # Stats), свой package-lock.json, та же причина разделения, что
            # у frontend/ выше: собирается в статику, которую раздаёт Caddy
            # напрямую (web/stats-site/), без общего бэкенда с
            # dashboard/server.js.
            - name: Install stats-frontend dependencies
              working-directory: stats-frontend
              run: npm ci

            - name: Stats-frontend lint
              working-directory: stats-frontend
              run: npm run lint

            - name: Stats-frontend test
              working-directory: stats-frontend
              run: npm test

            - name: Stats-frontend build
              working-directory: stats-frontend
              run: npm run build

            # stats-backend-java/ — фаза 1 перехода stats-backend на Java
            # (гексагональная архитектура), см. stats-backend-java/README.md.
            # Не задеплоен и не подключён ни в docker-compose.yml, ни в
            # Caddyfile — собирается и тестируется здесь только чтобы не
            # бить мод незамеченным, пока он растёт.
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '21'
                  cache: maven
                  cache-dependency-path: stats-backend-java/pom.xml

            - name: Stats-backend-java build and test
              working-directory: stats-backend-java
              run: mvn -B verify
