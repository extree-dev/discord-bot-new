name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    lint-and-test:
        runs-on: ubuntu-latest
        # Тесты, доходящие до хранилища (security/config.js, tickets/config.js,
        # utils/warnings.js), работают через настоящий PostgreSQL, а не мок —
        # поднимаем его как сервис-контейнер рядом с job.
        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: discordbot
                    POSTGRES_PASSWORD: discordbot
                    POSTGRES_DB: discordbot
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U discordbot -d discordbot"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        env:
            DATABASE_URL: postgresql://discordbot:discordbot@localhost:5432/discordbot
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Check formatting
              run: npm run format:check

            - name: Test
              run: npm test --if-present
