name: Deploy to VPS

on:
    push:
        branches: [main]
    workflow_dispatch: {}

# Без этого два push подряд (например, слияние двух PR с разницей в пару
# минут) запускали бы два деплоя параллельно — оба SSH'ятся на один и тот
# же VPS и одновременно гоняют одни и те же scripts/setup-*.js против одной
# и той же гильдии. ID-идемпотентность в scripts/lib/idempotent.js не
# спасает от такой гонки: оба процесса читают "ID ещё не сохранён" до того,
# как первый успеет записать результат, и оба создают канал/роль — именно
# так задублировались каналы и роли после подряд смерженных PR. cancel-in-progress:
# false — не отменяем уже идущий деплой (он мог быть на середине docker
# compose up), а просто ставим следующий в очередь и ждём.
concurrency:
    group: deploy-${{ github.ref }}
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Deploy over SSH
              uses: appleboy/ssh-action@v1.2.0
              with:
                  host: ${{ secrets.VPS_HOST }}
                  port: ${{ secrets.VPS_PORT }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  # По умолчанию у ssh-action весь script обязан уложиться в
                  # 10 минут (command_timeout) — с запасом хватало, пока в
                  # конце не появились 15 последовательных "docker compose
                  # run --rm bot node ..." (каждый — отдельный старт
                  # контейнера + обращения к Discord API). На практике сама
                  # выкладка (сборка образов, docker compose up) укладывается
                  # в минуту, а этот хвост setup-скриптов съедал остаток
                  # лимита и падал с "Run Command Timeout" уже ПОСЛЕ
                  # того, как всё нужное на сервере отработало (см. PR #309,
                  # #311 — задеплоено успешно, а CI всё равно красный).
                  # 30 минут — с кратным запасом под все 15 шагов разом.
                  command_timeout: 30m
                  script: |
                      set -e
                      cd /root/discord-bot-new
                      git fetch origin main
                      git reset --hard origin/main
                      docker compose up -d --build
                      docker image prune -f

                      # web/Caddyfile монтируется в контейнер bind-mount'ом
                      # (docker-compose.yml), поэтому правки только в его
                      # содержимом не меняют описание сервиса "caddy" — "up
                      # -d" такой контейнер не пересоздаёт, и новый конфиг
                      # не подхватывается сам по себе. Раньше здесь был
                      # "caddy reload" (применяет конфиг без разрыва
                      # соединений) — но на практике он регулярно отчитывался
                      # об успехе (exit 0, лог "adapted config to JSON" без
                      # единой ошибки), а реально раздаваемый сайт при этом
                      # оставался на СТАРОМ конфиге (проверено на баге с
                      # bot.extree.tech/maintenance: правка web/Caddyfile не
                      # применялась ни после обычного деплоя, ни после
                      # повторного workflow_dispatch, только после ручного
                      # "docker compose restart caddy" на сервере). Поэтому
                      # вместо зависимости от admin API reload — обычный
                      # restart контейнера: пара секунд простоя на caddy
                      # (бот и БД не трогает), зато гарантированно читает
                      # Caddyfile и web/bot-site/ с диска заново при старте.
                      docker compose restart caddy

                      # Extree Stats (stats-frontend/) — не рантайм-сервис,
                      # одноразовый билд-джоб: собирает Vite-бандл и
                      # перезаписывает им ./web/stats-site/ (bind-mount
                      # /output, см. docker-compose.yml). Reload/restart
                      # caddy для этого не нужен — file_server читает
                      # статику с диска на каждый запрос, а не кеширует
                      # её в памяти процесса.
                      docker compose build stats-frontend-builder
                      docker compose run --rm stats-frontend-builder

                      # Регистрация слэш-команд и setup-скрипты в режиме синхронизации
                      # (utils/setupMode.js): только находят уже существующие каналы
                      # и роли, сохраняют их ID и обновляют собственные панели бота.
                      # На сервере деплой ничего не создаёт, не удаляет, не
                      # переименовывает и не переставляет права — первичная
                      # настройка только вручную: node scripts/setup-X.js --bootstrap.
                      # Без set -e и по одному через run_setup_step: сбой одного не
                      # должен мешать остальным. Деплой всё равно помечается упавшим,
                      # если хоть один шаг не прошёл.
                      set +e
                      FAILED=0
                      run_setup_step() {
                          docker compose run --rm bot node "$1"
                          if [ $? -ne 0 ]; then
                              echo "::warning::$1 завершился с ошибкой, смотри лог выше"
                              FAILED=1
                          fi
                      }
                      run_setup_step deploy-commands.js
                      run_setup_step scripts/setup-roles.js
                      run_setup_step scripts/setup-verification.js
                      run_setup_step scripts/setup-tickets.js
                      run_setup_step scripts/setup-ticket-management.js
                      run_setup_step scripts/setup-punishment-notices.js
                      run_setup_step scripts/setup-temp-voice.js
                      run_setup_step scripts/setup-suggestions.js
                      run_setup_step scripts/setup-rules.js
                      run_setup_step scripts/setup-changelog.js
                      run_setup_step scripts/setup-leveling.js
                      run_setup_step scripts/setup-modqueue.js
                      run_setup_step scripts/setup-idea-queue.js
                      # После rules/changelog/leveling/tickets/suggestions/
                      # voice/idea-queue — памятка ссылается на каналы всех
                      # этих фич по сохранённому ID (memo/index.js
                      # gatherChannelIds), порядок здесь важен.
                      run_setup_step scripts/setup-memo.js
                      run_setup_step scripts/setup-admin-panel.js
                      # scripts/setup-onboarding.js и
                      # scripts/add-onboarding-role-questions.js в деплой не
                      # входят: адаптация Discord редактируется только
                      # целиком, и прогон на каждом деплое затирал ручные
                      # правки. Запускать вручную, когда нужно.
                      # Канал #📬│game-news задан константой в самом скрипте,
                      # от setup-changelog.js не зависит — порядок здесь не важен.
                      run_setup_step scripts/setup-valorant-news.js
                      run_setup_step scripts/setup-esports-news.js
                      run_setup_step scripts/setup-game-news.js
                      exit $FAILED
