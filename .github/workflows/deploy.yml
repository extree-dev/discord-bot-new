name: Deploy to VPS

on:
    push:
        branches: [main]
    workflow_dispatch: {}

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Deploy over SSH
              uses: appleboy/ssh-action@v1.2.0
              with:
                  host: ${{ secrets.VPS_HOST }}
                  port: ${{ secrets.VPS_PORT }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  script: |
                      set -e
                      cd /root/discord-bot-new
                      git fetch origin main
                      git reset --hard origin/main
                      docker compose up -d --build
                      docker image prune -f

                      # Регистрация слэш-команд и все setup-скрипты идемпотентны
                      # (находят/создают недостающее, ничего не портят при повторном
                      # запуске) — прогоняем их на каждый деплой, чтобы новые команды,
                      # роли, каналы и т.п. появлялись на сервере без ручного захода
                      # по SSH после каждого push.
                      docker compose run --rm bot node deploy-commands.js
                      docker compose run --rm bot node scripts/setup-server.js
                      docker compose run --rm bot node scripts/setup-roles.js
                      docker compose run --rm bot node scripts/setup-verification.js
                      docker compose run --rm bot node scripts/setup-tickets.js
                      docker compose run --rm bot node scripts/setup-temp-voice.js
                      docker compose run --rm bot node scripts/setup-suggestions.js
                      docker compose run --rm bot node scripts/setup-rules.js
